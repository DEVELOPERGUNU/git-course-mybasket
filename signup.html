<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-violet-100 text-slate-900">
    <main class="flex min-h-screen items-center justify-center px-4 py-12">
        <section class="w-full max-w-md rounded-3xl border border-white bg-white p-8 shadow-2xl shadow-indigo-200/60 sm:p-10">
            <div class="mb-8 text-center">
                <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 text-xl font-bold text-white shadow-lg shadow-indigo-200" aria-hidden="true">M</div>
                <h1 class="text-3xl font-bold tracking-tight">Create your account</h1>
                <p class="mt-2 text-sm leading-6 text-slate-500">Sign up to get started. It only takes a minute.</p>
            </div>

            <form action="#" method="post" class="space-y-5">
                <div>
                    <label for="name" class="mb-2 block text-sm font-medium text-slate-700">Full name</label>
                    <input id="name" name="name" type="text" autocomplete="name" required placeholder="Jane Smith" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100">
                </div>
                <div>
                    <label for="email" class="mb-2 block text-sm font-medium text-slate-700">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100">
                </div>
                <div>
                    <label for="password" class="mb-2 block text-sm font-medium text-slate-700">Password</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100">
                </div>
                <button type="submit" class="w-full rounded-xl bg-indigo-600 px-4 py-3.5 text-sm font-semibold text-white shadow-lg shadow-indigo-200 transition hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-200">Create account</button>
            </form>

            <p class="mt-7 text-center text-sm text-slate-500">Already have an account? <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-700">Sign in</a></p>
        </section>
    </main>
</body>
</html>
